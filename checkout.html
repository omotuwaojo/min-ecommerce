<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MyStore</title>
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Slick Carousel CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css" />

    <!-- Custom CSS Styles -->
    <link rel="stylesheet" href="./assests/css/style.css" />
    <link rel="stylesheet" href="./assests/css/home.css">       
</head>
<body>
    <!-- Header -->
    <header class="bg-primary text-white py-2 sticky-top shadow-sm mb-3 ">
        <div class="container d-flex align-items-center justify-content-between flex-wrap">
            <div class="d-flex align-items-center">
                <button class="btn btn-light d-lg-none me-2" id="hamburger"><i class="fas fa-bars"></i></button>
                <a href="#">
                    <h3 class="mb-0 fw-bold text-white text-decoration-none">Market<span class="text-warning">kit</span>
                    </h3>
                </a>
            </div>
            <br><br>
            <nav class="d-none d-lg-flex gap-4 align-items-center">
                <i class=""></i></a>
                <a href="#"><i class="fas fa-store"></i></a>
                <a href="#"><i class="fas fa-file"></i></a>
                <a href="#"><i class="fas fa-blog"></i></a>
            </nav>
            <form class="d-flex align-items-center flex-grow-1 mx-3">
                <input class="form-control me-2" type="search" placeholder="Search for items…" />
                <button class="btn btn-dark" type="submit"><i class="fas fa-search"></i></button>
            </form>
            <div class="d-flex align-items-center gap-3">
                <a href="#" class="text-white text-decoration-none"><i class="fas fa-user"></i> Login/Register</a>
                <a href="#" id="cart-icon" class="text-white position-relative">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge bg-danger rounded-circle"
                        id="cart-count">0</span>
                </a>
                <button class="btn btn-outline-light" id="toggle-theme"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </header>

    <div class="checkout-container py-2">
        <div class="checkout-form">
            <form id="checkoutForm">
                <div class="form-section">
                    <h2>BILLING DETAILS</h2>
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="Companyname">Company name (optional)</label>
                        <input type="text" id="Companyname">
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <select id="country" required>
                            <option value="">Select Country</option>
                            <option value="US">United States</option>
                            <option value="UK">United Kingdom</option>
                            <option value="CA">Canada</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="address">Street address *</label>
                            <input type="text" id="firstName" placeholder="House number and Street name" required>
                        </div>
                        <div class="form-group">
                            <label for="apartment"> </label>
                            <input type="text" id="apartment" placeholder="Apartment, suite, unit, etc. (optional)">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">Town/City *</label>
                            <input type="text" id="city" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="country">State/County *</label>
                        <select id="country" required>
                            <option value="">Select State</option>
                            <option value="">Kuala Lumpur</option>
                            <option value="">Putrajaya</option>
                            <option value="">Selangor</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="postcode">Postcode/Zip *</label>
                            <input type="number" id="postcode" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone">Phone *</label>
                            <input type="tel" id="phone" required>
                        </div>
                    </div>

                    <!-- Create an account -->
                    <div class="form-group">
                        <label class="checkbox-toggle">
                            <input type="checkbox" onclick="toggleDropdown(this)">
                            <span class="label-text">Create an account?</span>
                        </label>
                        <div class="dropdown-content">
                            <div class="form-group">
                                <label for="account-password">Create account password *</label>
                                <input type="password" id="account-password" placeholder="Password" required>
                            </div>
                        </div>
                    </div>

                    <!-- Ship to different address -->
                    <div class="form-group">
                        <label class="checkbox-toggle">
                            <input type="checkbox" onclick="toggleDropdown(this)">
                            <span class="label-text">Ship to a different address?</span>
                        </label>
                        <div class="dropdown-content">
                            <div class="shipping-address-form">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="shipping-firstName">First Name *</label>
                                        <input type="text" id="shipping-firstName" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="shipping-lastName">Last Name *</label>
                                        <input type="text" id="shipping-lastName" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="shipping-company">Company name (optional)</label>
                                    <input type="text" id="shipping-company">
                                </div>
                                <div class="form-group">
                                    <label for="shipping-country">Country *</label>
                                    <select id="shipping-country" required>
                                        <option value="">Select Country</option>
                                        <option value="US">United States</option>
                                        <option value="UK">United Kingdom</option>
                                        <option value="CA">Canada</option>
                                    </select>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="shipping-address">Street address *</label>
                                        <input type="text" id="shipping-address" placeholder="House number and Street name" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="shipping-apartment"> </label>
                                        <input type="text" id="shipping-apartment" placeholder="Apartment, suite, unit, etc. (optional)">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="shipping-city">Town/City *</label>
                                        <input type="text" id="shipping-city" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="shipping-state">State/County *</label>
                                    <select id="shipping-state" required>
                                        <option value="">Select State</option>
                                        <option value="">Kuala Lumpur</option>
                                        <option value="">Putrajaya</option>
                                        <option value="">Selangor</option>
                                    </select>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="shipping-postcode">Postcode/Zip *</label>
                                        <input type="number" id="shipping-postcode" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="order-notes">Order notes <span class="optional">(optional)</span></label>
                        <textarea id="order-notes" placeholder="Notes about your order, e.g. special notes for delivery."></textarea>
                    </div>
                </div>
            </form>
        </div>
        
        <div class="order-summary">
            <h2>Your Order</h2>
            <div class="paysub">
                <h2>Payment</h2>
                <h2>Subtotal</h2>
            </div>
            
            <div class="order-item">
                <span>3-Way Black Sling Bag × 1</span>
                <span>RM189.00</span>
            </div>
            <div class="order-item">
                <span>Subtotal</span>
                <span>RM189.00</span>
            </div>
            <div class="order-item">
                <span>Shipping</span>
                <span>RM5.99</span>
            </div>
            <div class="order-item">
                <span>Tax</span>
                <span>RM8.25</span>
            </div>
            <div class="order-item total">
                <span>Total</span>
                <span>RM224.21</span>
            </div>

            <div class="form-section">
                <div class="payment-methods">
                    <div class="payment-option">
                        <input type="radio" id="creditCard" name="payment" checked>
                        <label for="creditCard">Credit Card</label>
                    </div>
                    <div class="payment-option">
                        <input type="radio" id="paypal" name="payment">
                        <label for="paypal">PayPal</label>
                    </div>
                    <div class="payment-option">
                        <input type="radio" id="bankTransfer" name="payment">
                        <label for="bankTransfer">Bank Transfer</label>
                    </div>
                </div>
                
                <div id="creditCardDetails">
                    <div class="form-group">
                        <label for="cardNumber">Card Number</label>
                        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expiry">Expiry Date</label>
                            <input type="text" id="expiry" placeholder="MM/YY">
                        </div>
                        <div class="form-group">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" placeholder="123">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="cardName">Name on Card</label>
                        <input type="text" id="cardName">
                    </div>
                </div>
            </div>
            
            <button type="submit">PLACE ORDER</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white py-5">
        <div class="container text-center mb-5">
            <h4 class="fw-bold mb-3">Subscribe to our Newsletter</h4>

            <form class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-3">
                <input type="email" class="form-control w-100 w-md-50" placeholder="Enter your email" required>

                <button type="submit" class="btn btn-outline-primary px-4">
                    Subscribe
                </button>

                <a href="mailto:calebdainitife@gmail.com"
                    class="btn btn-outline-primary d-inline-flex align-items-center gap-2 px-4 py-2 fw-semibold shadow-sm">
                    <i class="bi bi-envelope"></i> Email Us
                </a>
            </form>
        </div>

        <div
            class="container border-top pt-4 d-flex flex-column flex-md-row justify-content-between align-items-center text-center text-md-start">
            <!-- Logo -->
            <div class="mb-4 mb-md-0">
                <a href="index.html" class="text-white fw-bold fs-3 text-decoration-none">
                    Market<span class="text-warning">kit</span>
                </a>
            </div>

            <!-- Quick Links -->
            <div class="mb-4 mb-md-0">
                <h6 class="fw-bold mb-3">Quick Links</h6>
                <ul class="list-unstyled">
                    <li><a href="#" class="footer-link">Shop</a></li>
                    <li><a href="#" class="footer-link">Contact</a></li>
                    <li><a href="#" class="footer-link">FAQ</a></li>
                </ul>
            </div>

            <!-- Social Icons -->
            <div>
                <h6 class="fw-bold mb-3">Follow Us</h6>
                <div class="d-flex justify-content-center gap-3">
                    <a href="#" class="social-icon"><i class="fab fa-facebook fa-lg"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-twitter fa-lg"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-instagram fa-lg"></i></a>
                </div>
            </div>
        </div>
    </footer>


    <script>
        // Simple form handling
        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Order submitted successfully!');
            // In a real implementation, you would process the payment here
        });
        
        // Toggle dropdown content for checkboxes
        function toggleDropdown(checkbox) {
            const content = checkbox.closest('.checkbox-toggle').nextElementSibling;
            if (checkbox.checked) {
                content.classList.add("show");
            } else {
                content.classList.remove("show");
            }
        }
    </script>
</body>
</html>
