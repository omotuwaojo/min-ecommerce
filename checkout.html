<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MyStore</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .checkout-container {
            display: flex;
            gap: 30px;
        }
        .checkout-form {
            flex: 2;
        }
        .order-summary {
            flex: 1;
            background: #f9f9f9;
            padding: 20px;
            /* border-radius: 5px; */
        }
        .form-section {
            margin-bottom: 30px;
            margin-right: 20px;
        }
        h1, h2, h3 {
            color: #222;
        }
        .form-row {
            display: flex;
            gap: 50px;
            margin-bottom: 15px;
        }
        .form-group {
            flex: 1;
        }
        #firstName, #lastName, #email, #phone, #postcode, #city, #country, #state, #Companyname{
            margin-bottom: 15px;
        }
        #country{
            margin-top: 10px;
        }
        #apartment{
            margin-top: 25px;
        }
        #shipping-apartment {
            margin-top: 25px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            /* border-radius: 4px; */
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 16px;
            /* border-radius: 4px; */
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .paysub {
            display: flex;
            justify-content: space-between;
        }
        .total {
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
        }
        .payment-methods {
            margin-top: 20px;
        }
        .payment-option {
            margin-bottom: 10px;
        }
        
        /* New styles for checkbox sections */
        .checkbox-toggle {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 10px 0;
        }
        
        .checkbox-toggle input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
            width: auto;
        }
        
        .checkbox-toggle .label-text {
            font-weight: bold;
        }
        
        .dropdown-content {
            display: none;
            border-radius: 4px;
            margin-top: 10px;
            margin-bottom: 15px;
        }
        
        .dropdown-content.show {
            display: block;
        }
        
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            /* border-radius: 4px; */
            min-height: 100px;
            resize: vertical;
        }
        
        .optional {
            color: #999;
            font-weight: normal;
        }
        
        .shipping-address-form {
            background-color: #f5f5f5;
            padding: 20px;
            /* border-radius: 4px; */
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="checkout-form">
            <form id="checkoutForm">
                <div class="form-section">
                    <h2>BILLING DETAILS</h2>
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="Companyname">Company name (optional)</label>
                        <input type="text" id="Companyname">
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <select id="country" required>
                            <option value="">Select Country</option>
                            <option value="US">United States</option>
                            <option value="UK">United Kingdom</option>
                            <option value="CA">Canada</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="address">Street address *</label>
                            <input type="text" id="firstName" placeholder="House number and Street name" required>
                        </div>
                        <div class="form-group">
                            <label for="apartment"> </label>
                            <input type="text" id="apartment" placeholder="Apartment, suite, unit, etc. (optional)">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">Town/City *</label>
                            <input type="text" id="city" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="country">State/County *</label>
                        <select id="country" required>
                            <option value="">Select State</option>
                            <option value="">Kuala Lumpur</option>
                            <option value="">Putrajaya</option>
                            <option value="">Selangor</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="postcode">Postcode/Zip *</label>
                            <input type="number" id="postcode" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone">Phone *</label>
                            <input type="tel" id="phone" required>
                        </div>
                    </div>

                    <!-- Create an account -->
                    <div class="form-group">
                        <label class="checkbox-toggle">
                            <input type="checkbox" onclick="toggleDropdown(this)">
                            <span class="label-text">Create an account?</span>
                        </label>
                        <div class="dropdown-content">
                            <div class="form-group">
                                <label for="account-password">Create account password *</label>
                                <input type="password" id="account-password" placeholder="Password" required>
                            </div>
                        </div>
                    </div>

                    <!-- Ship to different address -->
                    <div class="form-group">
                        <label class="checkbox-toggle">
                            <input type="checkbox" onclick="toggleDropdown(this)">
                            <span class="label-text">Ship to a different address?</span>
                        </label>
                        <div class="dropdown-content">
                            <div class="shipping-address-form">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="shipping-firstName">First Name *</label>
                                        <input type="text" id="shipping-firstName" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="shipping-lastName">Last Name *</label>
                                        <input type="text" id="shipping-lastName" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="shipping-company">Company name (optional)</label>
                                    <input type="text" id="shipping-company">
                                </div>
                                <div class="form-group">
                                    <label for="shipping-country">Country *</label>
                                    <select id="shipping-country" required>
                                        <option value="">Select Country</option>
                                        <option value="US">United States</option>
                                        <option value="UK">United Kingdom</option>
                                        <option value="CA">Canada</option>
                                    </select>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="shipping-address">Street address *</label>
                                        <input type="text" id="shipping-address" placeholder="House number and Street name" required>
                                    </div>
                                    <div class="form-group">
                                        <label for="shipping-apartment"> </label>
                                        <input type="text" id="shipping-apartment" placeholder="Apartment, suite, unit, etc. (optional)">
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="shipping-city">Town/City *</label>
                                        <input type="text" id="shipping-city" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="shipping-state">State/County *</label>
                                    <select id="shipping-state" required>
                                        <option value="">Select State</option>
                                        <option value="">Kuala Lumpur</option>
                                        <option value="">Putrajaya</option>
                                        <option value="">Selangor</option>
                                    </select>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="shipping-postcode">Postcode/Zip *</label>
                                        <input type="number" id="shipping-postcode" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="order-notes">Order notes <span class="optional">(optional)</span></label>
                        <textarea id="order-notes" placeholder="Notes about your order, e.g. special notes for delivery."></textarea>
                    </div>
                </div>
            </form>
        </div>
        
        <div class="order-summary">
            <h2>Your Order</h2>
            <div class="paysub">
                <h2>Payment</h2>
                <h2>Subtotal</h2>
            </div>
            
            <div class="order-item">
                <span>3-Way Black Sling Bag × 1</span>
                <span>RM189.00</span>
            </div>
            <div class="order-item">
                <span>Subtotal</span>
                <span>RM189.00</span>
            </div>
            <div class="order-item">
                <span>Shipping</span>
                <span>RM5.99</span>
            </div>
            <div class="order-item">
                <span>Tax</span>
                <span>RM8.25</span>
            </div>
            <div class="order-item total">
                <span>Total</span>
                <span>RM224.21</span>
            </div>

            <div class="form-section">
                <div class="payment-methods">
                    <div class="payment-option">
                        <input type="radio" id="creditCard" name="payment" checked>
                        <label for="creditCard">Credit Card</label>
                    </div>
                    <div class="payment-option">
                        <input type="radio" id="paypal" name="payment">
                        <label for="paypal">PayPal</label>
                    </div>
                    <div class="payment-option">
                        <input type="radio" id="bankTransfer" name="payment">
                        <label for="bankTransfer">Bank Transfer</label>
                    </div>
                </div>
                
                <div id="creditCardDetails">
                    <div class="form-group">
                        <label for="cardNumber">Card Number</label>
                        <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="expiry">Expiry Date</label>
                            <input type="text" id="expiry" placeholder="MM/YY">
                        </div>
                        <div class="form-group">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" placeholder="123">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="cardName">Name on Card</label>
                        <input type="text" id="cardName">
                    </div>
                </div>
            </div>
            
            <button type="submit">PLACE ORDER</button>
        </div>
    </div>

    <script>
        // Simple form handling
        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Order submitted successfully!');
            // In a real implementation, you would process the payment here
        });
        
        // Toggle dropdown content for checkboxes
        function toggleDropdown(checkbox) {
            const content = checkbox.closest('.checkbox-toggle').nextElementSibling;
            if (checkbox.checked) {
                content.classList.add("show");
            } else {
                content.classList.remove("show");
            }
        }
    </script>
</body>
</html>
