<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - MyStore</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .checkout-container {
            display: flex;
            gap: 30px;
        }
        .checkout-form {
            flex: 2;
        }
        .order-summary {
            flex: 1;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
        }
        .form-section {
            margin-bottom: 30px;
            margin-right: 20px;
        }
        h1, h2, h3 {
            color: #222;
        }
        .form-row {
            display: flex;
            gap: 50px;
            margin-bottom: 15px;
            /* margin-right: 20px; */
        }
        .form-group {
            flex: 1;
        }
        #apartment{
            margin-top: 25px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .paysub {
            display: flex;
            justify-content: space-between;
        }
        .total {
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
        }
        .payment-methods {
            margin-top: 20px;
        }
        .payment-option {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Checkout</h1>
    
    <div class="checkout-container">
        <div class="checkout-form">
            <form id="checkoutForm">
                <div class="form-section">
                    <h2>BILLING DETAILS</h2>
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="Companyname">Company name (optional)</label>
                        <input type="text" id="Companyname">
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <select id="country" required>
                            <option value="">Select Country</option>
                            <option value="US">United States</option>
                            <option value="UK">United Kingdom</option>
                            <option value="CA">Canada</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="address">Street address *</label>
                            <input type="text" id="firstName" placeholder="House number and Street name" required>
                        </div>
                        <div class="form-group">
                            <label for="apartment"> </label>
                            <input type="text" id="apartment" placeholder="Apartment, suite, unit, etc. (optional)">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">Town/City *</label>
                            <input type="text" id="city" required>
                        </div>
                        <div class="form-group">
                            <label for="zip">ZIP Code</label>
                            <input type="text" id="zip" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="country">State/County *</label>
                        <select id="country" required>
                            <option value="">Select State</option>
                            <option value="">Kuala Lumpur</option>
                            <option value="UK">Putrajaya</option>
                            <option value="CA">Canada</option>
                        </select>
                    </div>
                </div>
                
                
            </form>
        </div>
        
        <div class="order-summary">
            <h2>Your Order</h2>
            <div class="paysub">
                <h2>Payment</h2>
                <h2>Subtotal</h2>
            </div>
            
            <div class="order-item">
                <span>3-Way Black Sling Bag × 1</span>
                <span>RM189.00</span>
            </div>
            <!-- <div class="order-item">
                <span>Product 2 × 2</span>
                <span>$59.98</span>
            </div> -->
            <div class="order-item">
                <span>Subtotal</span>
                <span>RM189.00</span>
            </div>
            <div class="order-item">
                <span>Shipping</span>
                <span>RM5.99</span>
            </div>
            <div class="order-item">
                <span>Tax</span>
                <span>RM8.25</span>
            </div>
            <div class="order-item total">
                <span>Total</span>
                <span>RM224.21</span>
            </div>


            <div class="form-section">
                    <!-- <h2>Payment Method</h2> -->
                    <div class="payment-methods">
                        <div class="payment-option">
                            <input type="radio" id="creditCard" name="payment" checked>
                            <label for="creditCard">Credit Card</label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" id="paypal" name="payment">
                            <label for="paypal">PayPal</label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" id="bankTransfer" name="payment">
                            <label for="bankTransfer">Bank Transfer</label>
                        </div>
                    </div>
                    
                    <div id="creditCardDetails">
                        <div class="form-group">
                            <label for="cardNumber">Card Number</label>
                            <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="expiry">Expiry Date</label>
                                <input type="text" id="expiry" placeholder="MM/YY">
                            </div>
                            <div class="form-group">
                                <label for="cvv">CVV</label>
                                <input type="text" id="cvv" placeholder="123">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="cardName">Name on Card</label>
                            <input type="text" id="cardName">
                        </div>
                    </div>
                </div>
                
                <button type="submit">Complete Order</button>
        </div>
    </div>

    <script>
        // Simple form handling
        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Order submitted successfully!');
            // In a real implementation, you would process the payment here
        });
    </script>
</body>
</html>
